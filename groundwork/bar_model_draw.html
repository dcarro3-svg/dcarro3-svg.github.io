<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Model Tool — Groundwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:       #1c1a16;
    --parchment: #f5f0e8;
    --moss:      #3d5c3a;
    --amber:     #c17f3b;
    --gold:      #e8b84b;
    --sage:      #7a9e76;
    --cream:     #faf7f0;
    --muted:     #7a7163;
    --border:    #d8cfbe;
    --canvas-bg: #ffffff;
  }

  html, body {
    height: 100%;
    background: var(--parchment);
    font-family: 'DM Mono', monospace;
    color: var(--ink);
    overflow: hidden;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.5;
  }

  /* ── Layout ── */
  .tool-page {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 0.75rem 1rem 0.75rem;
    gap: 0.6rem;
  }

  /* ── Toolbar ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    flex-shrink: 0;
    padding: 0.4rem 0.5rem;
    background: var(--cream);
    border: 1px solid var(--border);
  }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 0.25rem;
  }

  .tool-sep {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 0.35rem;
    flex-shrink: 0;
  }

  .tool-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }

  .tool-btn:hover {
    color: var(--ink);
    background: var(--parchment);
    border-color: var(--border);
  }

  .tool-btn.active {
    color: var(--moss);
    background: rgba(61,92,58,0.08);
    border-color: rgba(61,92,58,0.25);
  }

  .tool-btn svg {
    width: 18px;
    height: 18px;
    pointer-events: none;
    display: block;
  }

  /* Tooltip */
  .tool-btn::after {
    content: attr(data-tip);
    position: absolute;
    top: calc(100% + 7px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 0.28rem 0.6rem;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    z-index: 100;
  }

  .tool-btn:hover::after { opacity: 1; }

  /* Grid toggle — hide native checkbox */
  #gridLabel input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0; height: 0;
  }

  /* ── Canvas wrapper ── */
  #canvasWrapper {
    position: relative;
    flex: 1;
    min-height: 0;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    background: var(--canvas-bg);
    border: 1px solid var(--border);
  }

  /* ── Context menu ── */
  #contextMenu {
    position: absolute;
    background: var(--cream);
    border: 1px solid var(--border);
    padding: 0.3rem 0;
    display: none;
    z-index: 200;
    box-shadow: 0 8px 28px rgba(28,26,22,0.14);
    min-width: 148px;
  }

  .ctx-btn {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    width: 100%;
    padding: 0.5rem 0.9rem;
    border: none;
    background: none;
    text-align: left;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    color: var(--ink);
    transition: background 0.1s;
    white-space: nowrap;
  }

  .ctx-btn svg { width: 13px; height: 13px; flex-shrink: 0; opacity: 0.6; }
  .ctx-btn:hover { background: var(--parchment); }
  .ctx-btn:hover svg { opacity: 1; }

  .ctx-divider {
    height: 1px;
    background: var(--border);
    margin: 0.25rem 0;
  }

  .ctx-delete { color: #8b1a0e; }
  .ctx-delete svg { opacity: 0.55; }
  .ctx-delete:hover { background: rgba(139,26,14,0.06); }

  /* ── Label input overlay ── */
  .label-input {
    position: absolute;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: rgba(250,247,240,0.95);
    color: var(--ink);
    z-index: 20;
    box-sizing: border-box;
    text-align: center;
    outline: none;
  }

  .label-input:focus { border-color: var(--amber); }

  /* ── Equation Builder ── */
  #eq-builder {
    display: none;
    background: var(--cream);
    border: 1px solid var(--border);
    padding: 0.85rem 1rem;
    flex-shrink: 0;
  }

  #eq-builder.active { display: flex; flex-direction: column; gap: 0.6rem; }

  .eq-section-label {
    font-size: 0.55rem;
    font-weight: 400;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.22em;
  }

  .eq-bar-buttons, .eq-op-buttons {
    display: flex;
    gap: 0.3rem;
    flex-wrap: wrap;
  }

  .eq-bar-buttons button, .eq-op-buttons button {
    padding: 0.3rem 0.75rem;
    border: 1px solid var(--border);
    background: var(--parchment);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    color: var(--ink);
    transition: background 0.1s, border-color 0.1s;
  }

  .eq-bar-buttons button:hover, .eq-op-buttons button:hover {
    background: white;
    border-color: var(--amber);
  }

  .eq-strip {
    background: var(--parchment);
    border: 1px solid var(--border);
    padding: 0.5rem 0.75rem;
    min-height: 34px;
    display: flex;
    gap: 0.3rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .eq-token {
    background: rgba(61,92,58,0.1);
    border: 1px solid rgba(61,92,58,0.25);
    padding: 0.2rem 0.6rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--moss);
    letter-spacing: 0.05em;
  }

  .eq-controls { display: flex; gap: 0.4rem; }

  .eq-controls button {
    padding: 0.4rem 0.9rem;
    border: 1px solid var(--border);
    background: var(--parchment);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    color: var(--ink);
    transition: background 0.1s;
  }

  .eq-controls button:hover:not(:disabled) { background: white; border-color: var(--amber); }
  .eq-controls button:disabled { opacity: 0.35; cursor: not-allowed; }

  #eq-submit-btn {
    background: var(--moss);
    color: var(--cream);
    border-color: var(--moss);
    flex: 1;
  }

  #eq-submit-btn:hover:not(:disabled) { background: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>

<div class="tool-page">

  <!-- Equation builder (word problem mode) -->
  <div id="eq-builder">
    <div class="eq-section-label">Labels</div>
    <div class="eq-bar-buttons" id="eq-bar-buttons"></div>
    <div class="eq-section-label">Words</div>
    <div class="eq-op-buttons" id="eq-op-buttons"></div>
    <div class="eq-strip" id="eq-strip">
      <span style="color:var(--muted);font-style:italic;font-size:0.65rem;letter-spacing:0.06em;">Build the relation…</span>
    </div>
    <div class="eq-controls">
      <button id="eq-back-btn">← Back</button>
      <button id="eq-submit-btn" disabled>Submit →</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">

    <div class="tool-group">
      <!-- Grid toggle -->
      <label class="tool-btn" id="gridLabel" data-tip="Toggle grid">
        <input type="checkbox" id="gridToggle" checked>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M1 7h18M1 13h18M7 1v18M13 1v18"/>
        </svg>
      </label>

      <!-- Add guide line -->
      <button class="tool-btn" id="addGuideBtn" data-tip="Add guide line">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="10" y1="3" x2="10" y2="17" stroke-dasharray="3 2.5"/>
          <path d="M7 6l3-3 3 3"/>
          <path d="M7 14l3 3 3-3"/>
        </svg>
      </button>
    </div>

    <div class="tool-sep"></div>

    <div class="tool-group">
      <!-- Undo -->
      <button class="tool-btn" id="undoBtn" data-tip="Undo">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7H13a3 3 0 010 6H4"/>
          <path d="M4 4l-3 3 3 3"/>
        </svg>
      </button>

      <!-- Clear all -->
      <button class="tool-btn" id="clearBtn" data-tip="Clear all">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h14"/>
          <path d="M8 6V4h4v2"/>
          <path d="M5 6l1 11h8l1-11"/>
          <path d="M9 10v4M11 10v4"/>
        </svg>
      </button>
    </div>

    <div class="tool-sep"></div>

    <div class="tool-group">
      <!-- Download -->
      <button class="tool-btn" id="downloadBtn" data-tip="Download PNG">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3v10"/>
          <path d="M6 9l4 4 4-4"/>
          <path d="M3 16h14"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- Canvas -->
  <div id="canvasWrapper">
    <canvas id="canvas"></canvas>

    <!-- Context menu -->
    <div id="contextMenu">
      <button id="lockToggleBtn" class="ctx-btn">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <rect x="2" y="6" width="10" height="7" rx="1"/>
          <path d="M4.5 6V4.5a2.5 2.5 0 015 0V6"/>
        </svg>
        <span id="lockToggleLabel">Lock</span>
      </button>
      <button id="fadedToggleBtn" class="ctx-btn">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <ellipse cx="7" cy="7" rx="5" ry="3.5"/>
          <circle cx="7" cy="7" r="1.5" fill="currentColor"/>
        </svg>
        <span id="fadedToggleLabel">Make faded</span>
      </button>
      <button id="editLabelBtn" class="ctx-btn">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 2.5l2 2-7 7H2.5v-2l7-7z"/>
        </svg>
        Edit label
      </button>
      <div class="ctx-divider"></div>
      <button id="deleteBtn" class="ctx-btn ctx-delete">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h10M5 4V2.5h4V4M3.5 4l.75 7.5h5.5L10.5 4"/>
        </svg>
        Delete
      </button>
    </div>
  </div>

</div>

<script>
const canvas      = document.getElementById('canvas');
const ctx         = canvas.getContext('2d');
const gridToggle  = document.getElementById('gridToggle');
const gridLabel   = document.getElementById('gridLabel');
const addGuideBtn = document.getElementById('addGuideBtn');
const undoBtn     = document.getElementById('undoBtn');
const clearBtn    = document.getElementById('clearBtn');
const downloadBtn = document.getElementById('downloadBtn');
const canvasWrapper   = document.getElementById('canvasWrapper');
const contextMenu     = document.getElementById('contextMenu');
const lockToggleBtn   = document.getElementById('lockToggleBtn');
const lockToggleLabel = document.getElementById('lockToggleLabel');
const fadedToggleBtn  = document.getElementById('fadedToggleBtn');
const fadedToggleLabel= document.getElementById('fadedToggleLabel');
const editLabelBtn    = document.getElementById('editLabelBtn');
const deleteBtn       = document.getElementById('deleteBtn');

/* ── DPR scaling for crisp rendering ── */
const DPR = window.devicePixelRatio || 1;

function initCanvas() {
  const wrapper = canvasWrapper;
  const w = wrapper.offsetWidth;
  const h = wrapper.offsetHeight;
  canvas.width  = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function canvasW() { return Math.round(canvas.width  / DPR); }
function canvasH() { return Math.round(canvas.height / DPR); }

window.addEventListener('resize', () => { initCanvas(); scheduleRedraw(); });
initCanvas();

const GRID       = 25;
const LABEL_FONT = "15px 'Cormorant Garamond', Georgia, serif";

let bars   = [];
let guides = [];

let drawing    = false;
let drawStart  = null;
let currentBar = null;

let selectedObjects  = [];
let activeBar        = null;
let resizingBarInfo  = null;
let draggingLabelBar = null;
let labelOffsetX     = 0;
let labelOffsetY     = 0;
let draggingGuide    = null;
let resizingGuide    = null;
let guideResizeEdge  = null;

let contextTarget   = null;
let lastClickTime   = 0;
let lastClickTarget = null;

/* ── RAF-throttled redraw ── */
let rafPending = false;
function scheduleRedraw() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; redraw(); });
}

/* ── Render ── */
function drawGrid() {
  if (!gridToggle.checked) return;
  const W = canvasW(), H = canvasH();

  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += GRID) {
    const major = (x / GRID) % 4 === 0;
    ctx.strokeStyle = major ? 'rgba(193,127,59,0.18)' : 'rgba(193,127,59,0.09)';
    ctx.lineWidth   = major ? 0.75 : 0.5;
    ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += GRID) {
    const major = (y / GRID) % 4 === 0;
    ctx.strokeStyle = major ? 'rgba(193,127,59,0.18)' : 'rgba(193,127,59,0.09)';
    ctx.lineWidth   = major ? 0.75 : 0.5;
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke();
  }
}

function drawGuides() {
  ctx.setLineDash([5, 5]);
  for (const g of guides) {
    ctx.strokeStyle = g.locked ? '#3d5c3a' : '#7a9e76';
    ctx.lineWidth   = g.locked ? 2 : 1.5;
    ctx.beginPath();
    ctx.moveTo(g.x + 0.5, g.yTop);
    ctx.lineTo(g.x + 0.5, g.yBottom);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function centerLabel(bar) {
  if (!bar.label) return;
  ctx.font = LABEL_FONT;
  const tw = ctx.measureText(bar.label).width;
  bar.labelX = bar.x + bar.w / 2 - tw / 2;
  bar.labelY = bar.y + bar.h / 2 + 6;
}

function drawBars() {
  for (const b of bars) {
    ctx.save();
    if (b.faded) { ctx.globalAlpha = 0.28; ctx.setLineDash([6, 4]); }
    ctx.fillStyle   = '#fdfcf9';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = b.locked ? '#3d5c3a' : '#1c1a16';
    ctx.lineWidth   = b.locked ? 2.5 : 1.5;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.restore();
    if (b.label) {
      ctx.font      = LABEL_FONT;
      ctx.fillStyle = '#1c1a16';
      ctx.fillText(b.label, b.labelX, b.labelY);
    }
  }
}

function drawHighlight(obj) {
  ctx.save();
  ctx.strokeStyle = '#c17f3b';
  ctx.lineWidth   = 1.5;
  ctx.setLineDash([4, 4]);
  if (obj.type === 'bar') {
    const b = obj.ref;
    ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
  } else {
    const g = obj.ref;
    ctx.beginPath();
    ctx.moveTo(g.x + 0.5, g.yTop - 6);
    ctx.lineTo(g.x + 0.5, g.yBottom + 6);
    ctx.stroke();
  }
  ctx.restore();
}

function redraw() {
  const W = canvasW(), H = canvasH();
  ctx.clearRect(0, 0, W, H);

  // Canvas background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  drawGrid();
  drawBars();
  drawGuides();
  for (const obj of selectedObjects) drawHighlight(obj);

  if (currentBar) {
    ctx.fillStyle   = 'rgba(193,127,59,0.06)';
    ctx.fillRect(currentBar.x, currentBar.y, currentBar.w, currentBar.h);
    ctx.strokeStyle = '#c17f3b';
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(currentBar.x, currentBar.y, currentBar.w, currentBar.h);
    ctx.setLineDash([]);
  }
}

/* ── Hit tests ── */
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function barAt(x, y) {
  for (let i = bars.length - 1; i >= 0; i--) {
    const b = bars[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}

function labelAt(x, y) {
  ctx.font = LABEL_FONT;
  for (let i = bars.length - 1; i >= 0; i--) {
    const b = bars[i];
    if (!b.label) continue;
    const w = ctx.measureText(b.label).width;
    if (x >= b.labelX && x <= b.labelX + w && y >= b.labelY - 18 && y <= b.labelY) return b;
  }
  return null;
}

function guideAt(x, y) {
  for (let i = guides.length - 1; i >= 0; i--) {
    const g = guides[i];
    if (Math.abs(g.x - x) < 6 && y >= g.yTop && y <= g.yBottom) return g;
  }
  return null;
}

function guideHandleAt(x, y) {
  for (let i = guides.length - 1; i >= 0; i--) {
    const g = guides[i];
    if (Math.abs(g.x - x) < 8) {
      if (Math.abs(y - g.yTop)    < 6) return { guide: g, edge: 'top' };
      if (Math.abs(y - g.yBottom) < 6) return { guide: g, edge: 'bottom' };
    }
  }
  return null;
}

function barEdgeHit(b, x, y) {
  const m = 6;
  const left   = Math.abs(x - b.x)         < m;
  const right  = Math.abs(x - (b.x + b.w)) < m;
  const top    = Math.abs(y - b.y)         < m;
  const bottom = Math.abs(y - (b.y + b.h)) < m;
  if (!(left || right || top || bottom)) return null;
  return { left, right, top, bottom };
}

/* ── Cursor ── */
function updateCursor(p) {
  const gh = guideHandleAt(p.x, p.y);
  if (gh) { canvas.style.cursor = 'ns-resize'; return; }
  const g = guideAt(p.x, p.y);
  if (g)  { canvas.style.cursor = 'ew-resize'; return; }
  const lb = labelAt(p.x, p.y);
  if (lb) { canvas.style.cursor = 'move'; return; }
  const b = barAt(p.x, p.y);
  if (b) {
    const edges = barEdgeHit(b, p.x, p.y);
    if (edges) {
      const h = edges.left || edges.right;
      const v = edges.top  || edges.bottom;
      canvas.style.cursor = (h && v) ? 'nwse-resize' : h ? 'ew-resize' : 'ns-resize';
    } else {
      canvas.style.cursor = 'move';
    }
    return;
  }
  canvas.style.cursor = 'crosshair';
}

/* ── Selection ── */
function clearSelection() { selectedObjects = []; }
function selectObject(obj) { selectedObjects = [obj]; }

/* ── Label editor ── */
function startLabelEdit(bar) {
  if (bar.locked) return;
  ctx.font = LABEL_FONT;
  const text   = bar.label || '';
  const inputW = Math.max(80, Math.min(bar.w - 4, 240));
  const inputH = 26;
  const cx     = bar.x + bar.w / 2;
  const cy     = bar.y + bar.h / 2;

  const input   = document.createElement('input');
  input.type    = 'text';
  input.value   = text;
  input.className = 'label-input';
  input.style.left  = (cx - inputW / 2) + 'px';
  input.style.top   = (cy - inputH / 2) + 'px';
  input.style.width = inputW + 'px';

  canvasWrapper.appendChild(input);
  input.focus();
  input.select();

  function finish(commit) {
    if (commit) {
      bar.label = input.value.trim() || null;
      if (bar.label) centerLabel(bar);
      scheduleRedraw();
    }
    input.remove();
  }

  input.addEventListener('blur',    () => finish(true));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.stopPropagation(); finish(true);  }
    if (e.key === 'Escape') { e.stopPropagation(); finish(false); }
  });
}

/* ── Context menu ── */
function showContextMenu(clientX, clientY) {
  if (!contextTarget) return;
  const r     = canvasWrapper.getBoundingClientRect();
  const isBar = contextTarget.type === 'bar';

  lockToggleLabel.textContent = isBar
    ? (contextTarget.ref.locked ? 'Unlock bar'   : 'Lock bar')
    : (contextTarget.ref.locked ? 'Unlock guide' : 'Lock guide');

  fadedToggleBtn.style.display  = isBar ? 'flex' : 'none';
  fadedToggleLabel.textContent  = contextTarget.ref.faded ? 'Make solid' : 'Make faded';
  editLabelBtn.style.display    = isBar ? 'flex' : 'none';

  // Keep menu within canvas bounds
  const menuW = 160, menuH = 120;
  let left = clientX - r.left;
  let top  = clientY - r.top;
  if (left + menuW > r.width)  left = r.width  - menuW - 4;
  if (top  + menuH > r.height) top  = r.height - menuH - 4;

  contextMenu.style.left    = left + 'px';
  contextMenu.style.top     = top  + 'px';
  contextMenu.style.display = 'block';
}

function hideContextMenu() {
  contextMenu.style.display = 'none';
  contextTarget = null;
}

/* ── Mouse events ── */
canvas.addEventListener('mousedown', e => {
  hideContextMenu();
  const p   = getPos(e);
  const now = Date.now();

  // Right-click → context menu
  if (e.button === 2) {
    const g = guideAt(p.x, p.y);
    if (g) { contextTarget = { type: 'guide', ref: g }; showContextMenu(e.clientX, e.clientY); return; }
    const b = barAt(p.x, p.y);
    if (b) { contextTarget = { type: 'bar',   ref: b }; showContextMenu(e.clientX, e.clientY); return; }
    return;
  }

  if (e.button !== 0) return;

  const gh = guideHandleAt(p.x, p.y);
  if (gh && !gh.guide.locked) {
    resizingGuide   = gh.guide;
    guideResizeEdge = gh.edge;
    selectObject({ type: 'guide', ref: gh.guide });
    scheduleRedraw(); return;
  }

  const g = guideAt(p.x, p.y);
  if (g && !g.locked) {
    draggingGuide = g;
    selectObject({ type: 'guide', ref: g });
    scheduleRedraw(); return;
  }

  const labelBar = labelAt(p.x, p.y);
  if (labelBar && !labelBar.locked) {
    if (now - lastClickTime < 300 && lastClickTarget === labelBar) {
      lastClickTime = 0; lastClickTarget = null;
      startLabelEdit(labelBar); return;
    }
    lastClickTime = now; lastClickTarget = labelBar;
    draggingLabelBar = labelBar;
    labelOffsetX = p.x - labelBar.labelX;
    labelOffsetY = p.y - labelBar.labelY;
    selectObject({ type: 'bar', ref: labelBar });
    scheduleRedraw(); return;
  }

  const b = barAt(p.x, p.y);
  if (b && !b.locked) {
    if (now - lastClickTime < 300 && lastClickTarget === b) {
      lastClickTime = 0; lastClickTarget = null;
      startLabelEdit(b); return;
    }
    lastClickTime = now; lastClickTarget = b;
    const edges = barEdgeHit(b, p.x, p.y);
    activeBar = b;
    resizingBarInfo = edges
      ? { startX: p.x, startY: p.y, origX: b.x, origY: b.y, origW: b.w, origH: b.h, edges }
      : { offsetX: p.x - b.x, offsetY: p.y - b.y };
    selectObject({ type: 'bar', ref: b });
    scheduleRedraw(); return;
  }

  lastClickTime = 0; lastClickTarget = null;
  clearSelection();
  drawing   = true;
  drawStart = { x: p.x, y: p.y };
  currentBar = { x: p.x, y: p.y, w: 0, h: 0, color: '#000', label: null, labelX: 0, labelY: 0, locked: false, faded: false };
});

canvas.addEventListener('mousemove', e => {
  const p = getPos(e);

  if (drawing && currentBar && drawStart) {
    const x1 = Math.min(drawStart.x, p.x), x2 = Math.max(drawStart.x, p.x);
    const y1 = Math.min(drawStart.y, p.y), y2 = Math.max(drawStart.y, p.y);
    currentBar.x = x1; currentBar.y = y1;
    currentBar.w = x2 - x1; currentBar.h = y2 - y1;
    scheduleRedraw(); return;
  }

  if (draggingGuide && !draggingGuide.locked) {
    draggingGuide.x = p.x; scheduleRedraw(); return;
  }

  if (resizingGuide && !resizingGuide.locked) {
    if (guideResizeEdge === 'top')
      resizingGuide.yTop    = Math.min(p.y, resizingGuide.yBottom - 5);
    else
      resizingGuide.yBottom = Math.max(p.y, resizingGuide.yTop + 5);
    scheduleRedraw(); return;
  }

  if (draggingLabelBar && !draggingLabelBar.locked) {
    draggingLabelBar.labelX = p.x - labelOffsetX;
    draggingLabelBar.labelY = p.y - labelOffsetY;
    scheduleRedraw(); return;
  }

  if (activeBar && resizingBarInfo) {
    const b    = activeBar;
    const info = resizingBarInfo;
    if (info.offsetX !== undefined) {
      b.x = p.x - info.offsetX;
      b.y = p.y - info.offsetY;
      centerLabel(b);
    } else {
      const dx = p.x - info.startX, dy = p.y - info.startY;
      const { origX, origY, origW, origH, edges } = info;
      if (edges.left)   { const nw = origW - dx; if (nw > 5) { b.x = origX + dx; b.w = nw; } }
      if (edges.right)  { const nw = origW + dx; if (nw > 5)   b.w = nw; }
      if (edges.top)    { const nh = origH - dy; if (nh > 5) { b.y = origY + dy; b.h = nh; } }
      if (edges.bottom) { const nh = origH + dy; if (nh > 5)   b.h = nh; }
      centerLabel(b);
    }
    scheduleRedraw(); return;
  }

  updateCursor(p);
});

canvas.addEventListener('mouseup', () => {
  if (drawing && currentBar) {
    drawing = false;
    if (currentBar.w > 5 && currentBar.h > 5) {
      bars.push(currentBar);
      const newBar = currentBar;
      currentBar = null; drawStart = null;
      scheduleRedraw();
      startLabelEdit(newBar);
    } else {
      currentBar = null; drawStart = null;
      scheduleRedraw();
    }
    return;
  }
  draggingGuide = null; resizingGuide = null; guideResizeEdge = null;
  draggingLabelBar = null; activeBar = null; resizingBarInfo = null;
  scheduleRedraw();
});

canvas.addEventListener('mouseleave', () => {
  if (!drawing) {
    draggingGuide = null; resizingGuide = null;
    draggingLabelBar = null; activeBar = null; resizingBarInfo = null;
  }
  scheduleRedraw();
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ── Toolbar ── */
addGuideBtn.addEventListener('click', () => {
  guides.push({ x: canvasW() / 2, yTop: 0, yBottom: canvasH(), locked: false });
  scheduleRedraw();
});

undoBtn.addEventListener('click', () => {
  if (bars.length   > 0) bars.pop();
  else if (guides.length > 0) guides.pop();
  clearSelection(); scheduleRedraw();
});

clearBtn.addEventListener('click', () => {
  bars = []; guides = []; clearSelection(); scheduleRedraw();
});

gridToggle.addEventListener('change', () => {
  gridLabel.classList.toggle('active', gridToggle.checked);
  scheduleRedraw();
});

gridLabel.classList.toggle('active', gridToggle.checked);

downloadBtn.addEventListener('click', () => {
  // Render to a clean offscreen canvas (no DPR scaling artefacts)
  const off    = document.createElement('canvas');
  off.width    = canvasW();
  off.height   = canvasH();
  const octx   = off.getContext('2d');

  // White background
  octx.fillStyle = '#ffffff';
  octx.fillRect(0, 0, off.width, off.height);

  // Copy current canvas content (scaled back down)
  octx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, off.width, off.height);

  const link    = document.createElement('a');
  link.download = 'bar-model.png';
  link.href     = off.toDataURL('image/png');
  link.click();
});

/* ── Context menu actions ── */
lockToggleBtn.addEventListener('click', () => {
  if (!contextTarget) return;
  contextTarget.ref.locked = !contextTarget.ref.locked;
  hideContextMenu(); scheduleRedraw();
});

fadedToggleBtn.addEventListener('click', () => {
  if (!contextTarget || contextTarget.type !== 'bar') return;
  contextTarget.ref.faded = !contextTarget.ref.faded;
  hideContextMenu(); scheduleRedraw();
});

editLabelBtn.addEventListener('click', () => {
  if (!contextTarget || contextTarget.type !== 'bar') return;
  const bar = contextTarget.ref;
  hideContextMenu();
  startLabelEdit(bar);
});

deleteBtn.addEventListener('click', () => {
  if (!contextTarget) return;
  if (contextTarget.type === 'bar')   bars   = bars.filter(b => b !== contextTarget.ref);
  if (contextTarget.type === 'guide') guides = guides.filter(g => g !== contextTarget.ref);
  hideContextMenu(); clearSelection(); scheduleRedraw();
});

document.addEventListener('click', e => {
  if (!contextMenu.contains(e.target)) hideContextMenu();
});

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Backspace' || e.key === 'Delete') {
    if (document.activeElement.tagName === 'INPUT') return;
    e.preventDefault();
    for (const obj of selectedObjects) {
      if (obj.type === 'bar')   bars   = bars.filter(b => b !== obj.ref);
      if (obj.type === 'guide') guides = guides.filter(g => g !== obj.ref);
    }
    clearSelection(); scheduleRedraw();
  }
  if (e.key === 'Escape') { clearSelection(); scheduleRedraw(); }
});

/* ── Equation Builder (Word Problem Mode) ── */
let currentProblem = null;
let assembledEq    = [];

function appendToken(token) { assembledEq.push(token); renderEqStrip(); updateEqSubmitBtn(); }
function backToken()        { assembledEq.pop();        renderEqStrip(); updateEqSubmitBtn(); }

function renderEqStrip() {
  const el = document.getElementById('eq-strip');
  el.innerHTML = assembledEq.length === 0
    ? '<span style="color:var(--muted);font-style:italic;font-size:0.65rem;letter-spacing:0.06em;">Click bars or buttons to build equation…</span>'
    : assembledEq.map(t => `<span class="eq-token">${t}</span>`).join('');
}

function updateEqSubmitBtn() {
  document.getElementById('eq-submit-btn').disabled = assembledEq.length < 3;
}

function submitEquation() {
  if (assembledEq.length < 3) return;
  window.parent.postMessage({
    type:     'wp:submit',
    bars:     bars.map(b => ({ label: b.label || null, w: b.w, h: b.h, x: b.x, y: b.y, faded: b.faded, locked: b.locked })),
    equation: assembledEq
  }, '*');
}

function loadProblem(problem) {
  currentProblem = problem;
  assembledEq    = [];
  document.getElementById('eq-builder').classList.add('active');

  document.getElementById('eq-bar-buttons').innerHTML = problem.labels.map(label =>
    `<button onclick="appendToken('${label.replace(/'/g, "\\'")}')">${label}</button>`
  ).join('');

  document.getElementById('eq-op-buttons').innerHTML = problem.ops.map(op =>
    `<button onclick="appendToken('${op.replace(/'/g, "\\'")}')">${op}</button>`
  ).join('');

  renderEqStrip(); updateEqSubmitBtn();
  scheduleRedraw();
}

function resetCanvas() {
  bars = []; guides = []; assembledEq = []; selectedObjects = [];
  activeBar = null; currentProblem = null;
  document.getElementById('eq-builder').classList.remove('active');
  renderEqStrip(); updateEqSubmitBtn(); scheduleRedraw();
}

window.addEventListener('message', e => {
  if (e.data.type === 'wp:load')  loadProblem(e.data.problem);
  if (e.data.type === 'wp:reset') resetCanvas();
});

document.addEventListener('DOMContentLoaded', () => {
  window.parent.postMessage({ type: 'wp:ready' }, '*');
});

canvas.addEventListener('click', e => {
  if (!currentProblem) return;
  const p = getPos(e);
  for (let i = bars.length - 1; i >= 0; i--) {
    const b = bars[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h && b.label) {
      appendToken(b.label); break;
    }
  }
});

document.getElementById('eq-back-btn').addEventListener('click',   () => { if (assembledEq.length > 0) backToken(); });
document.getElementById('eq-submit-btn').addEventListener('click',  submitEquation);

/* ── Init ── */
scheduleRedraw();
</script>
</body>
