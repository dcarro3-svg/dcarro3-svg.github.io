<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractional Relations — Lesson 1.4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root{
    --bg:#DDD0F5;--surface:#EDE5FF;--border:#C4ADEE;
    --text-primary:#1E1530;--text-secondary:#584C72;--text-muted:#9589B8;
    --accent:#6845A8;--accent-light:#EEE6FF;
    --accent-warm:#D4600A;--accent-warm-light:#FBF0E4;
    --radius:12px;--radius-lg:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background-color:var(--bg);color:var(--text-primary);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
    background-image:url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='2' y='2' width='14' height='5' fill='%236845A8' fill-opacity='0.28'/%3E%3Crect x='2' y='9' width='7' height='5' fill='%236845A8' fill-opacity='0.22'/%3E%3Crect x='11' y='9' width='5' height='5' fill='%232B5DC7' fill-opacity='0.30'/%3E%3Crect x='40' y='4' width='10' height='5' fill='%232B5DC7' fill-opacity='0.34'/%3E%3Crect x='40' y='11' width='6' height='5' fill='%232B5DC7' fill-opacity='0.24'/%3E%3Crect x='48' y='11' width='4' height='5' fill='%236845A8' fill-opacity='0.20'/%3E%3Crect x='4' y='48' width='12' height='5' fill='%236845A8' fill-opacity='0.24'/%3E%3Crect x='4' y='55' width='6' height='5' fill='%232B5DC7' fill-opacity='0.28'/%3E%3Crect x='12' y='55' width='4' height='5' fill='%236845A8' fill-opacity='0.18'/%3E%3Crect x='44' y='32' width='8' height='5' fill='%232B5DC7' fill-opacity='0.30'/%3E%3Crect x='28' y='22' width='5' height='5' fill='%232B5DC7' fill-opacity='0.24'/%3E%3Crect x='18' y='44' width='10' height='5' fill='%236845A8' fill-opacity='0.22'/%3E%3Crect x='52' y='44' width='6' height='5' fill='%232B5DC7' fill-opacity='0.28'/%3E%3C/svg%3E");
    background-size:128px 128px;}
  .app{width:100%;max-width:680px;display:flex;flex-direction:column;gap:20px;}
  .header{display:flex;align-items:center;gap:12px;}
  .lesson-label{font-family:'DM Serif Display',serif;font-size:26px;letter-spacing:-0.5px;}
  .phase-label{font-size:12px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;flex:1;}
  .tts-toggle{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);
    background:var(--surface);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all 0.15s;flex-shrink:0;margin-left:auto;}
  .tts-toggle svg{width:16px;height:16px;fill:var(--text-muted);transition:fill 0.15s;}
  .tts-toggle.on{border-color:var(--accent);background:var(--accent-light);}
  .tts-toggle.on svg{fill:var(--accent);}
  .tts-toggle:hover{border-color:var(--accent);}
  .tts-toggle:hover svg{fill:var(--accent);}
  .progress-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.5s ease;}

  /* Canvas */
  .canvas{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:44px 40px;display:flex;align-items:center;justify-content:center;
    min-height:200px;box-shadow:0 2px 12px rgba(0,0,0,0.04);animation:fadeUp 0.35s ease;overflow:visible;}

  /* Instruction text — always visible, letter-by-letter animation */
  .instruct-text{background:var(--accent-light);border:1px solid #C4ADEE;border-radius:var(--radius-lg);
    padding:18px 24px;font-size:16px;font-weight:400;color:var(--text-primary);
    line-height:1.7;animation:fadeUp 0.35s ease;display:flex;align-items:flex-start;gap:12px;}
  .instruct-text.correction{background:var(--accent-warm-light);border-color:#E8C99A;}
  .instruct-text.neutral{background:var(--surface);border-color:var(--border);}
  .instruct-text.bridge{background:#EEE6FF;border-color:#C4ADEE;}
  .instruct-text.positive{background:var(--accent-light);border-color:#C4ADEE;}

  /* Letter-by-letter animation */
  .typed-text .char{opacity:0;animation:charFade 0.04s forwards;}
  @keyframes charFade{to{opacity:1;}}

  /* Audio replay button */
  .audio-indicator{width:48px;height:48px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
    transition:all 0.15s;border:none;margin-top:2px;overflow:visible;padding:0;}
  .audio-indicator:hover{background:#512F8A;transform:scale(1.05);
    box-shadow:0 0 0 2px #F0922B,0 0 10px 3px rgba(240,146,43,0.50),0 0 22px 6px rgba(240,146,43,0.22);}
  .audio-indicator.speaking{background:var(--accent-warm);animation:pulse 1s infinite;}
  .audio-indicator svg{width:16px;height:16px;fill:white;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  /* Question prompt */
  .question-prompt{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 18px;font-size:15px;font-weight:500;color:var(--text-primary);animation:fadeUp 0.2s ease;}

  /* Word bank — full-width below question for instruction phase */
  .instruct-layout{display:flex;gap:12px;align-items:flex-start;}
  .instruct-model{flex:1;}
  .instruct-word-bank{width:100%;border:2px solid var(--text-primary);
    border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;
    gap:5px;background:var(--surface);}
  .wb-group{display:flex;flex-direction:column;gap:6px;}
  .wb-row{display:flex;gap:3px;}
  .wb-div{height:1px;background:var(--border);margin:3px 0;}
  .wb-btn{width:100%;padding:10px 14px;border-radius:7px;border:1px solid var(--border);
    background:var(--surface);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;
    color:var(--text-primary);cursor:pointer;transition:all 0.1s;text-align:left;line-height:1.4;}
  .wb-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
  .wb-btn:active{transform:scale(0.96);}
  .wb-btn.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
  .wb-btn.correct{border-color:var(--accent);background:var(--accent);color:white;}
  .wb-btn.incorrect{border-color:#C0392B;background:#FDF0F0;color:#C0392B;}

  /* Assembled relation strip */
  .relation-strip{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:44px;}
  .r-token{background:var(--accent-light);border:1px solid #C4ADEE;border-radius:5px;
    padding:3px 9px;font-size:13px;font-weight:600;color:var(--accent);}
  .r-token.unk{background:#EEE6FF;border-color:#C4ADEE;color:#6845A8;}
  .strip-ph{font-size:13px;color:var(--text-muted);font-style:italic;}
  .strip-row{display:flex;gap:8px;align-items:center;margin-top:6px;}
  .btn-back{padding:7px 12px;border-radius:var(--radius);border:1px solid var(--border);
    background:var(--surface);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
    color:var(--text-secondary);cursor:pointer;}
  .btn-back:hover{border-color:var(--accent-warm);color:var(--accent-warm);}
  .btn-submit{padding:7px 16px;border-radius:var(--radius);border:none;background:var(--accent);
    color:white;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-submit:hover{background:#512F8A;
    box-shadow:0 0 0 2px #F0922B,0 0 12px 3px rgba(240,146,43,0.52),0 0 26px 7px rgba(240,146,43,0.24);}
  .btn-submit:disabled{opacity:0.35;pointer-events:none;}

  /* Response buttons (for review/ident phases) */
  .response-buttons{display:flex;gap:12px;flex-wrap:wrap;}
  .btn{flex:1;padding:15px 20px;border-radius:var(--radius);border:2px solid var(--border);
    background:var(--surface);font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;
    color:var(--text-primary);cursor:pointer;transition:all 0.15s;}
  .btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-continue{width:100%;padding:15px;border-radius:var(--radius);border:none;
    background:var(--accent);color:white;font-family:'DM Sans',sans-serif;
    font-size:16px;font-weight:600;cursor:pointer;transition:all 0.15s;}
  .btn-continue:hover{background:#512F8A;transform:translateY(-1px);
    box-shadow:0 0 0 2px #F0922B,0 0 14px 4px rgba(240,146,43,0.55),0 0 32px 10px rgba(240,146,43,0.28);}

  /* Relations found tags */
  .relations-found{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .relation-tag{background:var(--accent-light);border:1px solid #C4ADEE;border-radius:20px;
    padding:4px 12px;font-size:13px;font-weight:500;color:var(--accent);}

  /* Bar styles */
  .bar-h{height:62px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .bar-label{font-size:12px;font-weight:600;text-transform:capitalize;letter-spacing:0.3px;}

  /* Completion */
  .completion{text-align:center;padding:44px 32px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);box-shadow:0 2px 12px rgba(0,0,0,0.04);animation:fadeUp 0.5s ease;}
  .completion h2{font-family:'DM Serif Display',serif;font-size:26px;margin:12px 0 10px;color:var(--accent);}
  .completion p{color:var(--text-secondary);font-size:15px;line-height:1.6;max-width:380px;margin:0 auto;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="lesson-label">Fractional Relations</span>
    <span class="phase-label" id="phaseLabel">Introduction</span>
    <button class="tts-toggle" id="ttsToggle" onclick="toggleTTS()" title="Toggle audio">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="mainContent"></div>
  <div id="responseArea"></div>
</div>
<script>
// ═══════════════════════════════════════════════════════════════════════════════
// CONFIG — injected per lesson
// ═══════════════════════════════════════════════════════════════════════════════
const CFG = {
  id: 1.4,
  storageKey: 'fluency_l4_sessions',
  fluencyHref: 'fluency-l4.html',
  nextLessonHref: 'lesson-five.html',
  nextLessonLabel: 'Lesson 1.5 →',
  completionTitle: 'Fractional Relations',
  completionSummary: 'A fractional relation shows one equal part of a whole.<br><br><em>the part is one fraction of the whole</em>',
};

// ═══════════════════════════════════════════════════════════════════════════════
// TTS
// ═══════════════════════════════════════════════════════════════════════════════
let ttsEnabled = true;
let currentUtterance = null;
let isSpeaking = false;

function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  const btn = document.getElementById('ttsToggle');
  if (btn) btn.classList.toggle('on', ttsEnabled);
  if (!ttsEnabled) window.speechSynthesis.cancel();
}

function speak(text, onEnd) {
  if (!ttsEnabled) { if (onEnd) onEnd(); return; }
  const clean = text.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(clean);
  utt.rate = 0.92; utt.pitch = 1.0; utt.volume = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const pref = voices.find(v => v.name.includes('Samantha')||v.name.includes('Karen')||v.name.includes('Daniel')||v.name.includes('Google')||v.lang==='en-US');
  if (pref) utt.voice = pref;
  utt.onstart = () => { isSpeaking=true; const b=document.getElementById('audioBtn'); if(b)b.classList.add('speaking'); };
  utt.onend = () => { isSpeaking=false; const b=document.getElementById('audioBtn'); if(b)b.classList.remove('speaking'); if(onEnd)onEnd(); };
  utt.onerror = () => { isSpeaking=false; if(onEnd)onEnd(); };
  currentUtterance = utt;
  window.speechSynthesis.speak(utt);
}

function replayAudio() { if (currentUtterance && ttsEnabled) speak(currentUtterance.text); }
function audioBtn() {
  return `<button class="audio-indicator" id="audioBtn" onclick="replayAudio()">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  </button>`;
}

// ═══════════════════════════════════════════════════════════════════════════════
// LETTER-BY-LETTER TEXT ANIMATION
// ~33 chars/sec — fast enough to feel responsive, slow enough to feel intentional
// ═══════════════════════════════════════════════════════════════════════════════
const CHAR_DELAY_MS = 30; // 33 chars/sec

function animateText(text, containerId, onDone) {
  const el = document.getElementById(containerId);
  if (!el) { if (onDone) onDone(); return; }
  el.innerHTML = '';
  // Strip any HTML tags for animation, then show plain text char by char
  const plain = text.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
  const chars = plain.split('');
  chars.forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = ch === '\n' ? '' : ch;
    if (ch === '\n') span.appendChild(document.createElement('br'));
    span.style.animationDelay = `${i * CHAR_DELAY_MS}ms`;
    el.appendChild(span);
  });
  if (onDone) setTimeout(onDone, chars.length * CHAR_DELAY_MS + 80);
}

// Wrap text content for animation — always shown regardless of TTS state
function typedText(text) {
  const safe = text.replace(/'/g,"&#39;").replace(/"/g,"&quot;");
  return `<span class="typed-text" id="animText_${Date.now()}" data-text="${safe}"></span>`;
}

// Show text with animation
function showAnimText(text, containerId, onDone) {
  animateText(text, containerId, onDone);
}

// ═══════════════════════════════════════════════════════════════════════════════
// COLORS & UTILITIES
// ═══════════════════════════════════════════════════════════════════════════════
const COLORS=[{name:'blue',hex:'#1B6CA8'},{name:'orange',hex:'#D4600A'},{name:'green',hex:'#2D6A4F'},
  {name:'red',hex:'#C0392B'},{name:'purple',hex:'#6C3483'},{name:'teal',hex:'#0E7E7E'},
  {name:'pink',hex:'#B03A6E'},{name:'navy',hex:'#1A3A5C'}];
const CF={blue:['blue','navy','teal'],navy:['navy','blue'],teal:['teal','blue','green'],
  green:['green','teal'],red:['red','pink'],pink:['pink','red'],orange:['orange'],purple:['purple']};
function fam(n){const f=CF[n]||[n];return COLORS.filter(c=>f.includes(c.name)||(CF[c.name]||[c.name]).includes(n)).map(c=>c.name);}
function randColor(ex=[]){const ef=ex.flatMap(n=>fam(n));const pool=COLORS.filter(c=>!ef.includes(c.name));return pool.length?pool[Math.floor(Math.random()*pool.length)]:COLORS.filter(c=>!ex.includes(c.name))[0];}
function cmatch(r,n){return[...(CF[n]||[n]),n].some(f=>r.toLowerCase().includes(f));}
function tc(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(0.299*r+0.587*g+0.114*b)/255>0.55?'#1A1714':'#FFFFFF';}
function shuffle(a){const arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
const FRAC_NAMES=['half','third','fourth','fifth'];
const FRAC_DENOMS=[2,3,4,5];
function fracName(n){return FRAC_NAMES[n-2]||`${n}th`;}

// ═══════════════════════════════════════════════════════════════════════════════
// BAR RENDERERS — shared across all lessons
// ═══════════════════════════════════════════════════════════════════════════════
const BH=62, BASE=320;

function sbar(hex,name,w,isUnk=false){
  const col=tc(hex);
  const c=isUnk?`<span style="font-family:'DM Serif Display',serif;font-size:24px;font-style:italic;color:${col}">?</span>`
    :`<span class="bar-label" style="color:${col}">${name}</span>`;
  return `<div class="bar-h" style="width:${w}px;background:${hex}">${c}</div>`;
}

function renderEqual(m){
  if(m.layout==='dotted'){const w=m.w1;return`<div style="position:relative;display:inline-block;padding:0 20px"><div style="position:absolute;left:16px;top:0;bottom:0;border-left:2px dashed #9589B8"></div><div style="position:absolute;right:16px;top:0;bottom:0;border-right:2px dashed #9589B8"></div><div style="margin-bottom:8px">${sbar(m.c1.hex,m.c1.name,w,m.unk===m.c1.name)}</div>${sbar(m.c2.hex,m.c2.name,w,m.unk===m.c2.name)}</div>`;}
  return`<div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px">${sbar(m.c1.hex,m.c1.name,m.w1,m.unk===m.c1.name)}${sbar(m.c2.hex,m.c2.name,m.w2,m.unk===m.c2.name)}</div>`;
}

function renderPW(m){
  const{whole,p1,p2}=m;
  const wB=sbar(whole.color.hex,whole.color.name,whole.w,m.unknownRole==='whole');
  const p1Raw=sbar(p1.color.hex,p1.color.name,p1.w,m.unknownRole==='p1');
  const p2Raw=sbar(p2.color.hex,p2.color.name,p2.w,m.unknownRole==='p2');
  const p1B=m.fadedPart==='p1'?`<div style="opacity:0.35">${p1Raw}</div>`:p1Raw;
  const p2B=m.fadedPart==='p2'?`<div style="opacity:0.35">${p2Raw}</div>`:p2Raw;
  const lines=`<div style="position:absolute;left:0;top:0;bottom:0;border-left:2px dashed #9589B8"></div><div style="position:absolute;right:0;top:0;bottom:0;border-right:2px dashed #9589B8"></div>`;
  return`<div style="position:relative;display:inline-block">${lines}<div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px">${wB}<div style="display:flex">${p1B}${p2B}</div></div></div>`;
}

function renderComparison(m){
  const{larger,smaller,diff}=m;
  const lB=sbar(larger.color.hex,larger.color.name,larger.w,m.unknownRole==='larger');
  const sB=sbar(smaller.color.hex,smaller.color.name,smaller.w,m.unknownRole==='smaller');
  const dPale=diff?`<div style="width:${diff.w}px;height:${BH}px;background:${diff.color.hex}44;border:2px dashed #9589B8;border-radius:0 6px 6px 0;display:flex;align-items:center;justify-content:center;flex-shrink:0">${m.unknownRole==='diff'?`<span style="font-family:'DM Serif Display',serif;font-size:22px;font-style:italic;color:#777">?</span>`:`<span style="font-size:11px;font-weight:600;color:#777;text-transform:capitalize">${diff.color.name}</span>`}</div>`:'';
  const lines=diff?`<div style="position:absolute;left:${smaller.w}px;top:0;bottom:0;border-left:2px dashed #584C72"></div><div style="position:absolute;left:${larger.w}px;top:0;bottom:0;border-left:2px dashed #584C72"></div>`:'';
  return`<div style="position:relative;display:inline-block">${lines}<div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px">${lB}<div style="display:flex">${sB}${dPale}</div></div></div>`;
}

function renderFractional(m){
  const{wholeColor,partColor,denominator,filledIndex,unknownRole,wholeW}=m;
  const boxW=wholeW/denominator;
  const wBar=sbar(wholeColor.hex,wholeColor.name,wholeW,unknownRole==='whole');
  let boxes='';
  for(let i=0;i<denominator;i++){
    const iF=i===filledIndex,isUnk=iF&&unknownRole==='part';
    const bg=iF?partColor.hex:partColor.hex+'33',bdr=iF?'none':'2px dashed #9589B8',col=iF?tc(partColor.hex):'#9589B8';
    const c=isUnk?`<span style="font-family:'DM Serif Display',serif;font-size:22px;font-style:italic;color:${col}">?</span>`:iF?`<span style="font-size:11px;font-weight:600;text-transform:capitalize;color:${col}">${partColor.name}</span>`:' ';
    boxes+=`<div style="width:${boxW}px;height:${BH}px;background:${bg};border:${bdr};${i===0?'border-radius:6px 0 0 6px;':''}${i===denominator-1?'border-radius:0 6px 6px 0;':''}display:flex;align-items:center;justify-content:center;flex-shrink:0">${c}</div>`;
  }
  let lines='';
  for(let i=1;i<denominator;i++) lines+=`<div style="position:absolute;left:${i*boxW}px;top:0;bottom:0;border-left:2px dashed #9589B8;pointer-events:none"></div>`;
  lines+=`<div style="position:absolute;left:0;top:0;bottom:0;border-left:2px dashed #9589B8;pointer-events:none"></div>`;
  lines+=`<div style="position:absolute;left:${wholeW}px;top:0;bottom:0;border-left:2px dashed #9589B8;pointer-events:none"></div>`;
  return`<div style="position:relative;display:inline-block">${lines}<div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px">${wBar}<div style="display:flex">${boxes}</div></div></div>`;
}

// ═══════════════════════════════════════════════════════════════════════════════
// WORD BANK BUILDER — for instruction phase button responses
// Always exactly 3 options, shuffled.
// Pass distractors=null with a 3-item [correct, close, far] array as first arg,
// or pass acc + distractors array to use the legacy auto-build path.
// ═══════════════════════════════════════════════════════════════════════════════
function buildInstructWB(accOrOpts, distractors, onSelect) {
  let opts;
  if (distractors === null) {
    // Pre-built [correct, close, far] — shuffle and use directly
    opts = shuffle([...accOrOpts]);
  } else {
    const correct = accOrOpts[0];
    const pool = shuffle([correct, ...distractors.filter(d=>d!==correct)]).slice(0, 3);
    if (!pool.includes(correct)) { pool[pool.length-1] = correct; shuffle(pool); }
    opts = pool;
  }
  const btns = opts.map(o =>
    `<button class="wb-btn" onclick="${onSelect}('${o.replace(/'/g,"\\'")}')">${o}</button>`
  ).join('');
  return `<div class="instruct-word-bank"><div class="wb-group">${btns}</div></div>`;
}

}

const POSITIVE_MSGS = ['Yes!','Right!','Good!','That\'s it!','Nice work.','Exactly.'];

function showInstruct(step) {
  if (step >= INSTRUCT.length) { afterInstruct(); return; }

  }
  S.instructCurrentMode = S.instructMastery[step];
  const def = INSTRUCT[step];
  S.instructM = def.build ? def.build() : null;
  S.currentOpts = typeof def.opts === 'function' ? def.opts(S.instructM) : def.opts;
  setProgress(22 + (step / INSTRUCT.length) * 20);
  showInstructItem();
}

function showInstructItem() {
  const def = INSTRUCT[S.instructStep];
  const m = S.instructM;

  const opts = S.currentOpts;
  const modelHtml = m ? `<div class="canvas">${renderModel(m)}</div>` : '';

function submitInstruct(chosen) {
  const def = INSTRUCT[S.instructStep];
  const m = S.instructM;

  if (!S.instructFU) {
    const ok = chosen === S.currentOpts[0];
    if (ok) {
      recordResp('instruct', true);

      if (S.instructCurrentMode === 'D') S.instructMastery[S.instructStep] = 'G';
      else if (S.instructCurrentMode === 'G') S.instructMastery[S.instructStep] = 'T';
      showInstructFU();
    } else {
      recordResp('instruct', false);
      S.instructItemErrors++;

      if (S.instructCurrentMode === 'T') S.instructCurrentMode = 'G';
      else if (S.instructCurrentMode === 'G' && S.instructItemErrors >= 2) S.instructCurrentMode = 'D';
      showInstructItem();

    const ok = chosen === S.currentFuOpts[0];
    if (ok) {
      recordResp('instruct_fu', true);
      showInstruct(S.instructStep + 1);
    } else {
      recordResp('instruct_fu', false);
      S.instructItemErrors++;
      showInstructFUError();
    }
  }
}

// Build plausible distractors from the same conceptual pool
function buildDistractors(acc, m, def, isFU=false) {
  const correct = acc[0];
  const pool = [];

  // Color distractors — pick wrong colors from COLORS
  const colorNames = COLORS.map(c=>c.name);
  if (colorNames.some(c => acc.some(a => a.includes(c)))) {
    const usedColors = colorNames.filter(c => acc.some(a => a.includes(c)));
    const otherColors = colorNames.filter(c => !usedColors.includes(c));
    shuffle(otherColors).slice(0,2).forEach(c => pool.push(c));
  }

  // Relation word distractors
  const relWords = ['equal','not equal','plus','minus','part-whole','comparison','difference','halves','thirds','fourths','fifths','times','fraction'];
  relWords.filter(w => !acc.some(a=>a.includes(w))).slice(0,3).forEach(w=>pool.push(w));

  // Yes/no if acc includes yes/no
  if (acc.some(a=>a==='yes')) pool.push('no');
  if (acc.some(a=>a==='no')) pool.push('yes');

  // Fraction distractors
  if (acc.some(a=>FRAC_NAMES.includes(a))) {
    FRAC_NAMES.filter(f=>!acc.includes(f)).forEach(f=>pool.push(f));
  }

  // Number distractors
  ['two','three','four','five'].filter(n=>!acc.some(a=>a.includes(n))).slice(0,2).forEach(n=>pool.push(n));

  return shuffle(pool.filter(d=>d&&d!==correct)).slice(0,2);
}

function genCompReview(){
  const lC=randColor(),sC=randColor([lC.name]),dC=randColor([lC.name,sC.name]);
  const lW=BASE*(0.55+Math.random()*0.3),dW=lW*(0.2+Math.random()*0.3),sW=lW-dW;
  return{larger:{color:lC,w:lW},smaller:{color:sC,w:sW},diff:{color:dC,w:dW},
    diffStyle:'bar',unknownRole:'diff'};
}
function genFrac(unknownRole=null){
  const wC=randColor(),pC=randColor([wC.name]);
  const d=FRAC_DENOMS[Math.floor(Math.random()*FRAC_DENOMS.length)];
  const fi=Math.floor(Math.random()*d);
  const wW=BASE*(0.7+Math.random()*0.2);
  return{wholeColor:wC,partColor:pC,denominator:d,filledIndex:fi,unknownRole:unknownRole||'part',wholeW:wW,isFractional:true};
}
function genNEFrac(){
  const wC=randColor(),pC=randColor([wC.name]);
  const d=2+Math.floor(Math.random()*4);
  const wW=BASE*(0.7+Math.random()*0.2);
  const types=['unequal','mismatch','nowhole'];
  const neType=types[Math.floor(Math.random()*types.length)];
  return{wholeColor:wC,partColor:pC,denominator:d,wholeW:wW,isFractional:false,neType};
}

function renderNEFrac(m){
  const{wholeColor,partColor,denominator,wholeW,neType}=m;
  const boxW=wholeW/denominator;
  const wBar=sbar(wholeColor.hex,wholeColor.name,wholeW);
  let boxes='';
  if(neType==='unequal'){
    const widths=[wholeW*0.4,wholeW*0.35,...Array(denominator-2).fill(wholeW*0.25/(denominator-2))];
    for(let i=0;i<denominator;i++){const bg=i===0?partColor.hex:partColor.hex+'33';boxes+=`<div style="width:${Math.round(widths[i]||boxW)}px;height:${BH}px;background:${bg};border:${i===0?'none':'2px dashed #9B9591'};border-radius:${i===0?'6px 0 0 6px':i===denominator-1?'0 6px 6px 0':'0'};flex-shrink:0"></div>`;}
    return`<div style="display:flex;flex-direction:column;gap:8px">${wBar}<div style="display:flex">${boxes}</div></div>`;
  }
  if(neType==='mismatch'){
    const mW=boxW*0.6;
    for(let i=0;i<denominator;i++) boxes+=`<div style="width:${boxW}px;height:${BH}px;background:${partColor.hex}33;border:2px dashed #9B9591;flex-shrink:0"></div>`;
    return`<div style="display:flex;flex-direction:column;gap:8px">${wBar}<div style="display:flex;gap:12px;align-items:center"><div style="display:flex">${boxes}</div>${sbar(partColor.hex,partColor.name,Math.round(mW))}</div></div>`;
  }
  // nowhole
  for(let i=0;i<denominator;i++){const iF=i===0;boxes+=`<div style="width:${boxW}px;height:${BH}px;background:${iF?partColor.hex:partColor.hex+'33'};border:${iF?'none':'2px dashed #9B9591'};border-radius:${i===0?'6px 0 0 6px':i===denominator-1?'0 6px 6px 0':'0'};flex-shrink:0"></div>`;}
  return`<div style="display:flex">${boxes}</div>`;
}

function renderModel(m){
  if(m.isFractional===true) return renderFractional(m);
  if(m.isFractional===false) return renderNEFrac(m);
  if(m.larger) return renderComparison(m);
  if(m.whole&&m.p1) return renderPW(m);
  return renderEqual(m);
}

    setTimeout(()=>{S.reviewStep++;nextReview();},400);
    return;
  }
  S.reviewItemErrors++;
  let audio;
  if(S.reviewItemErrors>=2){
    audio=`This is a comparison. One bar is more than the other. There is a gap bar that shows the difference.`;
  } else {
    audio=`Look for two bars of different sizes and a gap bar between them.`;
  }
  render(`<div class="canvas">${renderComparison(S.currentModel)}</div>
    <div class="instruct-text correction">${audioBtn()}<span id="instructAnim" class="typed-text"></span></div>`,
    `<div class="response-buttons"><button class="btn" onclick="submitReview('yes')">Comparison</button><button class="btn" onclick="submitReview('no')">Not</button></div>`);
  speak(audio);animateText(audio,'instructAnim');
}

function showInstructIntro(){
  S.phase='instruction';setPhase('Instruction');setProgress(18);
  const audio=`You know comparisons. Now look at fractional relations — equal parts of a whole.`;
  render(`<div class="instruct-text" id="instructBox">${audioBtn()}<span id="instructAnim" class="typed-text"></span></div>`,
    `<div id="instructBtns" style="display:none"><button class="btn-continue" onclick="showInstruct(0)">Show me</button></div>`);
  speak(audio);
  animateText(audio,'instructAnim',()=>{const b=document.getElementById('instructBtns');if(b)b.style.display='block';});
}
function afterInstruct(){showIdentIntro();}

// ── Identification ─────────────────────────────────────────────────────────────
function showIdentIntro(){
  S.phase='ident';S.identStep=0;setPhase('Practice');setProgress(44);
  const audio=`Tell me if each picture shows a fractional relation or not.`;
  render(`<div class="instruct-text" id="instructBox">${audioBtn()}<span id="instructAnim" class="typed-text"></span></div>`,
    `<div id="instructBtns" style="display:none"><button class="btn-continue" onclick="nextIdent()">Ready</button></div>`);
  speak(audio);
  animateText(audio,'instructAnim',()=>{const b=document.getElementById('instructBtns');if(b)b.style.display='block';});
}
function nextIdent(){
  if(S.identStep>=S.totalIdent){showNamingIntro();return;}
  setProgress(46+(S.identStep/S.totalIdent)*20);
  S.identItemErrors=0;
  const isFrac=Math.random()>0.4;
  S.currentModel=isFrac?genFrac():genNEFrac();
  S.currentAnswer=isFrac?'yes':'no';startTimer();
  render(`<div class="canvas">${renderModel(S.currentModel)}</div><div class="question-prompt">Fractional Relation or Not?</div>`,
    `<div class="response-buttons"><button class="btn" onclick="submitIdent('yes')">Fractional Relation</button><button class="btn" onclick="submitIdent('no')">Not</button></div>`);
  speak('Fractional Relation or Not?');
}
function submitIdent(r){
  const ok=r===S.currentAnswer;
  recordResp('ident',ok);
  if(ok){
    document.getElementById('responseArea').innerHTML=`<div class="instruct-text positive" style="text-align:center;font-weight:700">${randPos()}</div>`;
    setTimeout(()=>{S.identStep++;nextIdent();},400);
    return;
  }
  S.identItemErrors++;
  let audio;
  if(S.identItemErrors>=2){
    audio=S.currentAnswer==='yes'
      ?`This is a fractional relation. There is a whole bar on top. Equal boxes below show parts of that whole.`
      :`This is not a fractional relation. Look for a whole bar on top with equal boxes below it.`;
  } else {
    audio=r==='yes'
      ?`Look — are the boxes equal? Does the picture show a whole bar on top?`
      :`Look again. Is there a whole bar on top with equal boxes below?`;
  }
  render(`<div class="canvas">${renderModel(S.currentModel)}</div>
    <div class="instruct-text correction">${audioBtn()}<span id="instructAnim" class="typed-text"></span></div>`,
    `<div class="response-buttons"><button class="btn" onclick="submitIdent('yes')">Fractional Relation</button><button class="btn" onclick="submitIdent('no')">Not</button></div>`);
  speak(audio);animateText(audio,'instructAnim');
}

// ── Naming ────────────────────────────────────────────────────────────────────
function showNamingIntro(){
  S.phase='naming';S.namingStep=0;setPhase('Relation Naming');setProgress(66);
  const audio=`The filled box is the unknown. Name the relation: one fraction of the whole equals unknown.`;
  render(`<div class="instruct-text" id="instructBox">${audioBtn()}<span id="instructAnim" class="typed-text"></span></div>`,
    `<div id="instructBtns" style="display:none"><button class="btn-continue" onclick="nextNaming()">Ready</button></div>`);
  speak(audio);
  animateText(audio,'instructAnim',()=>{const b=document.getElementById('instructBtns');if(b)b.style.display='block';});
}
function nextNaming(){
  if(S.namingStep>=S.totalNaming){showComplete();return;}
  setProgress(68+(S.namingStep/S.totalNaming)*28);
  S.namingItemErrors=0;
  S.currentModel=genFrac('part');
  const n=S.currentModel;
  S.currentNaming={whole:n.wholeColor.name,part:n.partColor.name,d:n.denominator,fracN:fracName(n.denominator)};
  startTimer();
  if(!S.scaffoldColorLocked&&S.scaffoldColorActive) showColorScaffold();
  else if(!S.scaffoldRoleLocked&&S.scaffoldRoleActive) showFracScaffold();
  else showNamingItem();
}
function showColorScaffold(){
  const n=S.currentNaming;
  const opts=shuffle([...COLORS.map(c=>c.name).filter(c=>c!==n.part).slice(0,3),n.part]);
  render(`<div class="canvas">${renderModel(S.currentModel)}</div><div class="question-prompt">What color is the unknown?</div>`,
    `<div class="response-buttons">${opts.map(o=>`<button class="btn" onclick="submitColorScaffold('${o}')">${o}</button>`).join('')}</div>`);
  speak('What color is the unknown?');
}
function submitColorScaffold(r){
  const n=S.currentNaming;const ok=cmatch(r,n.part);
  updateColorScaffold(ok);recordResp('scaffold_color',ok);
  if(ok){if(!S.scaffoldRoleLocked&&S.scaffoldRoleActive)showFracScaffold();else showNamingItem();}
  else{
    const audio=`Find the filled box with the question mark. What color is it?`;
    render(`<div class="canvas">${renderModel(S.currentModel)}</div>
      <div class="instruct-text correction">${audioBtn()}<span id="instructAnim" class="typed-text"></span></div>`,
      `<div class="response-buttons">${shuffle([...COLORS.map(c=>c.name).filter(c=>c!==n.part).slice(0,3),n.part]).map(o=>`<button class="btn" onclick="submitColorScaffold('${o}')">${o}</button>`).join('')}</div>`);
    speak(audio);animateText(audio,'instructAnim');
  }
}
function showFracScaffold(){
  const n=S.currentNaming;
  render(`<div class="canvas">${renderModel(S.currentModel)}</div><div class="question-prompt">How many equal parts are there?</div>`,
    `<div class="response-buttons">${FRAC_DENOMS.map(d=>`<button class="btn" onclick="submitFracScaffold(${d})">${d}</button>`).join('')}</div>`);
  speak('How many equal parts are there?');
}
function submitFracScaffold(d){
  const n=S.currentNaming;const ok=d===n.d;
  updateRoleScaffold(ok);recordResp('scaffold_frac',ok);
  if(ok){showNamingItem();return;}
  const audio=`Count the equal boxes below the whole bar. How many are there?`;
  render(`<div class="canvas">${renderModel(S.currentModel)}</div>
    <div class="instruct-text correction">${audioBtn()}<span id="instructAnim" class="typed-text"></span></div>`,
    `<div class="response-buttons">${FRAC_DENOMS.map(d=>`<button class="btn" onclick="submitFracScaffold(${d})">${d}</button>`).join('')}</div>`);
  speak(audio);animateText(audio,'instructAnim');
}
function showNamingItem(){
  const n=S.currentNaming;
  const correct=`one ${n.fracN} of ${n.whole} equals unknown`;
  const opts=shuffle([correct,`one ${n.fracN} of ${n.part} equals unknown`,`one ${fracName(n.d===2?3:2)} of ${n.whole} equals unknown`]).slice(0,3);
  if(!opts.includes(correct))opts[opts.length-1]=correct;
  render(`<div class="canvas">${renderModel(S.currentModel)}</div><div class="question-prompt">What equals the unknown?</div>`,
    `<div class="response-buttons">${shuffle(opts).map(o=>`<button class="btn" onclick="submitNaming('${o.replace(/'/g,"&#39;")}')">${o}</button>`).join('')}</div>`);
  speak('What equals the unknown?');
}
function submitNaming(r){
  const n=S.currentNaming;
  const correct=`one ${n.fracN} of ${n.whole} equals unknown`;
  const ok=r===correct||(cmatch(r,n.whole)&&r.includes(n.fracN));
  recordResp('naming',ok);updateColorScaffold(ok);updateRoleScaffold(ok);
  if(ok){
    document.getElementById('responseArea').innerHTML=`<div class="instruct-text positive" style="text-align:center;font-weight:700">${randPos()}</div>`;
    setTimeout(()=>{S.namingStep++;nextNaming();},500);
    return;
  }
  S.namingItemErrors++;
  let audio;
  if(S.namingItemErrors>=2){
    audio=`The relation is: ${correct}.`;
  } else {
    const spokenFrac=FRAC_NAMES&&FRAC_NAMES.find(f=>r.includes(f));
    audio=spokenFrac&&spokenFrac!==n.fracN
      ?`Count the equal boxes — there are ${n.d}, so use ${n.fracN}.`
      :`Name the whole too. Start with one ${n.fracN} of the whole color.`;
  }
  render(`<div class="canvas">${renderModel(S.currentModel)}</div>
    <div class="instruct-text correction">${audioBtn()}<span id="instructAnim" class="typed-text"></span></div>`,
    `<div class="response-buttons">${shuffle([correct,`one ${n.fracN} of ${n.part} equals unknown`,`one ${fracName(n.d===2?3:2)} of ${n.whole} equals unknown`]).slice(0,3).map(o=>`<button class="btn" onclick="submitNaming('${o.replace(/'/g,"&#39;")}')">${o}</button>`).join('')}</div>`);
  speak(audio);animateText(audio,'instructAnim');
}


// ── Init ──────────────────────────────────────────────────────────────────────
if (window.speechSynthesis) { window.speechSynthesis.onvoiceschanged=()=>{}; window.speechSynthesis.getVoices(); }
document.getElementById('ttsToggle').classList.add('on');
showIntro();
</script>

<!-- ═══════════════════════════════════════════════════════════════════════════
     BAR MODEL DRAW TOOL — embedded drawer
     • Toggle button: fountain pen icon, fixed bottom-right
     • Drawer:        slides up from bottom, contains iframe
     • Lazy-load:     iframe src set on first open (keeps page load fast)
     • To adjust:     DRAW_TOOL_SRC path, drawer height (#draw-drawer height),
                      button position (#draw-btn bottom/right)
════════════════════════════════════════════════════════════════════════════ -->
<style>
  /* ── Draw Tool: floating button ─────────────────────────────────────── */
  #draw-btn {
    position: fixed; bottom: 28px; right: 28px;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
    z-index: 900;
  }
  #draw-btn:hover {
    background: #512F8A; transform: scale(1.08);
    box-shadow: 0 0 0 2px #F0922B, 0 0 14px 4px rgba(240,146,43,0.55), 0 0 32px 10px rgba(240,146,43,0.28);
  }
  #draw-btn img { width: 32px; height: 32px; image-rendering: pixelated; }

  /* ── Draw Tool: sliding drawer ──────────────────────────────────────── */
  #draw-drawer {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 70vh;                          /* ← adjust drawer height here */
    background: var(--surface);
    border-top: 2px solid var(--accent);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 32px rgba(0,0,0,0.18);
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    z-index: 899; display: flex; flex-direction: column;
  }
  #draw-drawer.open { transform: translateY(0); }

  #draw-drawer-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px 8px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #draw-drawer-bar span {
    font-size: 14px; font-weight: 700; color: var(--text-primary);
    text-transform: uppercase; letter-spacing: 1px;
  }
  #draw-close {
    background: none; border: none; font-size: 22px; cursor: pointer;
    color: var(--text-muted); line-height: 1; padding: 2px 6px; border-radius: 6px;
  }
  #draw-close:hover { color: var(--accent); }
  #draw-iframe { flex: 1; border: none; width: 100%; }
</style>

<button id="draw-btn" onclick="toggleDrawer()" title="Bar Model Drawing Tool">
  <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
</button>

<div id="draw-drawer">
  <div id="draw-drawer-bar">
    <span>Bar Model Drawing Tool</span>
    <button id="draw-close" onclick="toggleDrawer()" title="Close">✕</button>
  </div>
  <iframe id="draw-iframe" src="" title="Bar Model Drawing Tool"></iframe>
</div>

<script>
  /* ── Bar Model Draw Tool — toggle logic ─────────────────────────────── */
  const DRAW_TOOL_SRC = 'bar_model_draw.html'; // ← update path if tool moves

  let drawerOpen = false;
  let iframeLoaded = false;

  function toggleDrawer() {
    drawerOpen = !drawerOpen;
    document.getElementById('draw-drawer').classList.toggle('open', drawerOpen);
    // Lazy-load: only fetch the iframe on first open
    if (drawerOpen && !iframeLoaded) {
      document.getElementById('draw-iframe').src = DRAW_TOOL_SRC;
      iframeLoaded = true;
    }
  }
</script>
</body>
</html>
