<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');

  .stage-name{font-size:11px;font-weight:600;color:var(--accent);margin-left:6px;text-transform:uppercase;letter-spacing:0.6px;}
  .unk-badge{display:inline-block;background:#F0EAF8;border:1.5px solid #C9B8E8;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:700;color:#6C3483;font-style:italic;}

  /* Drawing tool drawer */
  #draw-btn{position:fixed;top:28px;right:28px;width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.18);transition:background 0.15s,box-shadow 0.15s,transform 0.1s;z-index:900;}

<div class="app">
  <div class="header">
    <span class="lesson-label">Word Problems with Unknowns</span>
    <span class="phase-label" id="phaseLabel">Introduction</span>
    <span class="step-counter" id="stepCounter"></span>
    <button class="tts-toggle on" id="ttsToggle" onclick="toggleTTS()" title="Toggle audio">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>

<script src="word-problems.js"></script>
<script>
// ── Config ───────────────────────────────────────────────────────────────────
const CFG = {
  id: 10,
  storageKey: 'fluency_unit4b_sessions',
  fluencyHref: 'fluency-unit4b.html',
  nextHref: 'lesson-unit5.html',
  nextLabel: 'Lesson 4.3 →',
};

// ── TTS ──────────────────────────────────────────────────────────────────────
let ttsEnabled = true;
function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  const btn = document.getElementById('ttsToggle');
  if (btn) btn.classList.toggle('on', ttsEnabled);
  if (!ttsEnabled) window.speechSynthesis.cancel();
}
function speak(text, onEnd) {
  if (!ttsEnabled) { if (onEnd) onEnd(); return; }
  const clean = text.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(clean);
  utt.rate = 0.92; utt.pitch = 1.0; utt.volume = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const pref = voices.find(v => v.name.includes('Samantha') || v.name.includes('Karen') || v.name.includes('Daniel') || v.name.includes('Google') || v.lang === 'en-US');
  if (pref) utt.voice = pref;
  utt.onstart = () => { const b = document.getElementById('audioBtn'); if (b) b.classList.add('speaking'); };
  utt.onend = () => { const b = document.getElementById('audioBtn'); if (b) b.classList.remove('speaking'); if (onEnd) onEnd(); };
  utt.onerror = () => { if (onEnd) onEnd(); };
  window.speechSynthesis.speak(utt);
}
function replayAudio() {
  const p = INSTRUCT[S.instructStep];
  if (p && p.narration && p.narration[S.instructStage]) speak(p.narration[S.instructStage]);
}
function audioBtnHtml() {
  return `<button class="audio-indicator" id="audioBtn" onclick="replayAudio()" style="margin-left:auto">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
  </button>`;
}

// ── Constants ─────────────────────────────────────────────────────────────────
const BH = 62;
const BAR_S = 'box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0;';
const LBL_S = 'font-size:10px;font-weight:600;color:#1E1530;text-align:center;padding:0 5px;line-height:1.3;overflow:hidden;';

// ── Animated bar renderers ────────────────────────────────────────────────────
function renderAnimBarCMP(labels, proportions, unkLabel, stage, w) {
  w = w || 320;
  const smallW = Math.round(w * proportions[1]);
  const diffW  = w - smallW;
  const unks = unkLabel.toLowerCase();
  function bar(label, width, border, bg, delay) {
    const isUnk = label.toLowerCase() === unks;
    const anim  = stage === 1 ? `animation:buildIn 0.45s ease ${delay}ms both;` : '';
    const pulse = (isUnk && stage === 2) ? `animation:unkPulse 1.3s ease infinite;outline:2.5px dashed var(--accent);outline-offset:2px;` : '';
    const text  = (isUnk && stage >= 2) ? '?' : label;
    const tStyle = (isUnk && stage >= 2) ? `${LBL_S}font-size:18px;font-weight:700;color:var(--accent)` : LBL_S;
    return `<div style="${BAR_S}width:${width}px;height:${BH}px;background:${bg};${border}${anim}${pulse}"><span style="${tStyle}">${text}</span></div>`;
  }
  const large = bar(labels[0], w, 'border:2px solid #1E1530;border-radius:6px;', '#fff', 0);
  const small = bar(labels[1], smallW, 'border:2px solid #1E1530;border-right:1px solid #1E1530;border-radius:6px 0 0 6px;', '#fff', 200);
  const diff  = bar(labels[2], diffW, 'border:2px dashed #1E1530;border-left:none;border-radius:0 6px 6px 0;', '#F3F4F6', 400);
  return `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">${large}<div style="display:flex">${small}${diff}</div></div>`;
}

function renderAnimBarPW(labels, proportions, unkLabel, stage, w) {
  w = w || 320;
  const p1w = Math.round(w * proportions[0]);
  const p2w = w - p1w;
  const unks = unkLabel.toLowerCase();
  function bar(label, width, border, delay) {
    const isUnk = label.toLowerCase() === unks;
    const anim  = stage === 1 ? `animation:buildIn 0.45s ease ${delay}ms both;` : '';
    const pulse = (isUnk && stage === 2) ? `animation:unkPulse 1.3s ease infinite;outline:2.5px dashed var(--accent);outline-offset:2px;` : '';
    const text  = (isUnk && stage >= 2) ? '?' : label;
    const tStyle = (isUnk && stage >= 2) ? `${LBL_S}font-size:18px;font-weight:700;color:var(--accent)` : LBL_S;
    return `<div style="${BAR_S}width:${width}px;height:${BH}px;background:#fff;${border}${anim}${pulse}"><span style="${tStyle}">${text}</span></div>`;
  }
  const wBar  = bar(labels[0], w, 'border:2px solid #1E1530;border-radius:6px;', 0);
  const p1Bar = bar(labels[1], p1w, 'border:2px solid #1E1530;border-right:1px solid #1E1530;border-radius:6px 0 0 6px;', 200);
  const p2Bar = bar(labels[2], p2w, 'border:2px solid #1E1530;border-left:none;border-radius:0 6px 6px 0;', 400);
  return `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">${wBar}<div style="display:flex">${p1Bar}${p2Bar}</div></div>`;
}

function renderAnimBarMUL(labels, proportions, unkLabel, stage, w) {
  w = w || 320;
  const mult = proportions[0];
  const unitW = Math.round(w / mult);
  const unks = unkLabel.toLowerCase();
  function bar(label, width, delay) {
    const isUnk = label.toLowerCase() === unks;
    const anim  = stage === 1 ? `animation:buildIn 0.45s ease ${delay}ms both;` : '';
    const pulse = (isUnk && stage === 2) ? `animation:unkPulse 1.3s ease infinite;outline:2.5px dashed var(--accent);outline-offset:2px;` : '';
    const text  = (isUnk && stage >= 2) ? '?' : label;
    const tStyle = (isUnk && stage >= 2) ? `${LBL_S}font-size:18px;font-weight:700;color:var(--accent)` : LBL_S;
    return `<div style="${BAR_S}width:${width}px;height:${BH}px;background:#fff;border:2px solid #1E1530;border-radius:6px;${anim}${pulse}"><span style="${tStyle}">${text}</span></div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">${bar(labels[0], unitW, 0)}${bar(labels[1], w, 200)}</div>`;
}

function renderAnimBarEQ(labels, unkLabel, stage, w) {
  w = w || 320;
  const unks = unkLabel.toLowerCase();
  function bar(label, delay) {
    const isUnk = label.toLowerCase() === unks;
    const anim  = stage === 1 ? `animation:buildIn 0.45s ease ${delay}ms both;` : '';
    const pulse = (isUnk && stage === 2) ? `animation:unkPulse 1.3s ease infinite;outline:2.5px dashed var(--accent);outline-offset:2px;` : '';
    const text  = (isUnk && stage >= 2) ? '?' : label;
    const tStyle = (isUnk && stage >= 2) ? `${LBL_S}font-size:18px;font-weight:700;color:var(--accent)` : LBL_S;
    return `<div style="${BAR_S}width:${w}px;height:${BH}px;background:#fff;border:2px solid #1E1530;border-radius:6px;${anim}${pulse}"><span style="${tStyle}">${text}</span></div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">${bar(labels[0], 0)}${bar(labels[1], 200)}</div>`;
}

function renderAnimBarFRAC(labels, denominator, unkLabel, stage, w) {
  w = w || 320;
  const partW = Math.round(w / denominator);
  const unks = unkLabel.toLowerCase();
  function bar(label, width, delay) {
    const isUnk = label.toLowerCase() === unks;
    const anim  = stage === 1 ? `animation:buildIn 0.45s ease ${delay}ms both;` : '';
    const pulse = (isUnk && stage === 2) ? `animation:unkPulse 1.3s ease infinite;outline:2.5px dashed var(--accent);outline-offset:2px;` : '';
    const text  = (isUnk && stage >= 2) ? '?' : label;
    const tStyle = (isUnk && stage >= 2) ? `${LBL_S}font-size:18px;font-weight:700;color:var(--accent)` : LBL_S;
    return `<div style="${BAR_S}width:${width}px;height:${BH}px;background:#fff;border:2px solid #1E1530;border-radius:6px;${anim}${pulse}"><span style="${tStyle}">${text}</span></div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">${bar(labels[0], w, 0)}${bar(labels[1], partW, 200)}</div>`;
}

function renderInstructModel(p, stage) {
  if (p.type === 'cmp') return renderAnimBarCMP(p.labels, p.proportions, p.unkLabel, stage);
  if (p.type === 'pw')  return renderAnimBarPW(p.labels, p.proportions, p.unkLabel, stage);
  if (p.type === 'mul') return renderAnimBarMUL(p.labels, p.proportions, p.unkLabel, stage);
  if (p.type === 'eq')  return renderAnimBarEQ(p.labels, p.unkLabel, stage);
  if (p.type === 'frac') return renderAnimBarFRAC(p.labels, p.denominator || 2, p.unkLabel, stage);
  return '';
}

// ── Instruction problems ──────────────────────────────────────────────────────
const INSTRUCT = [
  {
    type: 'cmp',
    text: 'How many fewer dominoes does Jenny have than Elsa?',
    labels: ["Elsa's dominoes", "Jenny's dominoes", 'difference'],
    unkLabel: 'difference',
    proportions: [0.6, 0.4],
    narration: [
      "This is a comparison question. Elsa has more dominoes than Jenny. The unknown is the difference — how much more Elsa has than Jenny.",
      "I draw Elsa's dominoes as the longer bar on top. Below it, Jenny's dominoes and the difference bar together fill the same total width.",
      "The question asks for the difference — the gap. I mark that bar with a question mark to show it is the unknown.",
    ],
  },
  {
    type: 'pw',
    text: 'A board is split into a left section and a right section. How long is the whole board?',
    labels: ['whole board', 'left section', 'right section'],
    unkLabel: 'whole board',
    proportions: [0.7, 0.3],
    narration: [
      "The question asks for the whole board. The left section and right section join together to make the whole — this is a part-whole relation where the total is the unknown.",
      "I draw the whole board as a long bar on top. Below it, the left section and right section side by side fill the same total width.",
      "The whole board is what we do not know. I place a question mark on the top bar.",
    ],
  },
  {
    type: 'mul',
    text: 'The long rope is four times as long as the short rope. How long is the long rope?',
    labels: ['short rope', 'long rope'],
    unkLabel: 'long rope',
    proportions: [4],
    narration: [
      "The question asks for the length of the long rope. The relationship tells us the long rope is four times the short rope — this is a multiplicative relation.",
      "I draw the short rope as a small bar. Below it, the long rope bar is about four times as wide.",
      "The long rope is the unknown. I mark it with a question mark to show its value is what we need to find.",
    ],
  },
];

const PRACTICE = WP1U;

// ── State ─────────────────────────────────────────────────────────────────────
const S = {
  phase: 'intro',
  instructStep: 0,
  instructStage: 0,
  practiceStep: 0,
  totalInstruct: INSTRUCT.length,
  totalPractice: PRACTICE.length,
  responses: [],
  wpIframeReady: false,
  wpPendingLoad: null,
};

function render(html) { document.getElementById('main').innerHTML = html; }
function setPhase(l) { document.getElementById('phaseLabel').textContent = l; }

function updateProgress() {
  const total = S.totalInstruct + S.totalPractice;
  let done = 0;
  if (S.phase === 'instruct') done = S.instructStep;
  else if (S.phase === 'practice') done = S.totalInstruct + S.practiceStep;
  else if (S.phase === 'complete') done = total;
  document.getElementById('progressFill').style.width = `${Math.round((done / total) * 100)}%`;
  document.getElementById('stepCounter').textContent =
    S.phase === 'intro' ? '' :
    S.phase === 'instruct' ? `${S.instructStep + 1} / ${S.totalInstruct}` :
    S.phase === 'practice' ? `${S.practiceStep + 1} / ${S.totalPractice}` : '';
}

// ── Stage indicator ───────────────────────────────────────────────────────────
function stageIndicatorHtml(stage) {
  const names = ['Read', 'Build', 'Mark Unknown'];
  const dots = names.map((n, i) => {
    const cls = i < stage ? 'done' : i === stage ? 'active' : '';
    return `<div class="stage-dot ${cls}" title="${n}"></div>`;
  }).join('');
  return `<div class="stage-indicator">${dots}<span class="stage-name">${names[stage]}</span></div>`;
}

// ── Intro ─────────────────────────────────────────────────────────────────────
function showIntro() {
  S.phase = 'intro';
  setPhase('Introduction');
  updateProgress();
  render(`<div class="card">
    <h2>Word Problems with Unknowns — Lesson Eight</h2>
    <p>In this lesson you will read questions that ask about an unknown quantity, and draw a bar model that shows the relation.</p>
    <p>The key skill: label the bar that represents the unknown with <span class="unk-badge">?</span>. The bar's size should still reflect the relationship described.</p>
    <p>You will see three worked examples — then draw your own models for practice.</p>
    <p style="color:var(--accent);font-weight:600">Read each question carefully before drawing.</p>
    <button class="btn-start" onclick="startInstruct()">Ready</button>
  </div>`);
}

// ── Instruction phase ─────────────────────────────────────────────────────────
function startInstruct() {
  S.phase = 'instruct';
  S.instructStep = 0;
  S.instructStage = 0;
  setPhase('Instruction');
  showInstructStage();
}

function showInstructStage() {
  updateProgress();
  const p = INSTRUCT[S.instructStep];
  const stage = S.instructStage;
  const stageLabels = ['Build the model →', 'Mark the unknown →', stage === 2 ? (S.instructStep < S.totalInstruct - 1 ? 'Next example →' : 'Start practice →') : ''];

  const thinkHtml = p.narration[stage]
    ? `<div class="think-box">${p.narration[stage]}</div>` : '';

  const modelHtml = stage >= 1
    ? `<div style="margin-bottom:14px;overflow-x:auto">${renderInstructModel(p, stage)}</div>` : '';

  render(`<div class="card" style="animation:fadeUp 0.3s ease">
    ${stageIndicatorHtml(stage)}
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px">
      <div style="flex:1"><div class="problem-text">${p.text}</div></div>
      ${audioBtnHtml()}
    </div>
    ${thinkHtml}
    ${modelHtml}
    <button class="btn-continue" style="margin-top:14px" onclick="advanceInstructStage()">${stageLabels[stage]}</button>
  </div>`);

  if (p.narration[stage]) speak(p.narration[stage]);
}

function advanceInstructStage() {
  if (S.instructStage < 2) {
    S.instructStage++;
    showInstructStage();
  } else {
    S.instructStep++;
    S.instructStage = 0;
    if (S.instructStep >= S.totalInstruct) {
      startPractice();
    } else {
      showInstructStage();
    }
  }
}

// ── Practice phase ────────────────────────────────────────────────────────────
function startPractice() {
  S.phase = 'practice';
  S.practiceStep = 0;
  setPhase('Practice');
  renderPracticeItem();
}

function renderPracticeItem() {
  updateProgress();
  const p = PRACTICE[S.practiceStep];
  const labelDisplay = p.labels.map(l => l === '?' ? '<span class="unk-badge">?</span>' : `<strong>${l}</strong>`).join(', ');
  render(`<div class="card" style="animation:fadeUp 0.3s ease">
    <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px">Draw the bar model</div>
    <div class="problem-text">${p.text}</div>
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px">Labels: ${labelDisplay} — label the unknown bar <span class="unk-badge">?</span></div>
    <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:14px;">Open the drawing tool on the right →</div>
    <div id="drawFeedback"></div>
  </div>`);
  openDrawerForProblem(p);
}

// ── Model check ───────────────────────────────────────────────────────────────
function checkModel(bars, problem) {
  const nf = bars.filter(b => !b.faded);
  if (nf.length !== problem.expectedBars)
    return {ok: false, reason: `Draw ${problem.expectedBars} bars — one for each quantity.`};
  const lbls = nf.map(b => (b.label || '').toLowerCase());
  if (!lbls.some(l => l.includes('?')))
    return {ok: false, reason: `Label the unknown bar with "?".`};
  for (const exp of problem.labels.filter(l => l !== '?').map(l => l.toLowerCase())) {
    if (!lbls.some(l => l.includes(exp)))
      return {ok: false, reason: `Label each bar. Missing: ${exp}`};
  }
  if (problem.type === 'eq') {
    const s = [...nf].sort((a, b) => b.w - a.w);
    if (s.length >= 2 && s[s.length - 1].w / s[0].w < 0.75)
      return {ok: false, reason: 'Equal bars should be the same length.'};
  }
  if (problem.type === 'pw' || problem.type === 'cmp') {
    const s = [...nf].sort((a, b) => b.w - a.w);
    const pw = s.slice(1).map(b => b.w / s[0].w);
    const sp = [...pw].sort((a, b) => b - a);
    const se = [...problem.proportions].sort((a, b) => b - a);
    for (let i = 0; i < Math.min(sp.length, se.length); i++)
      if (Math.abs(sp[i] - se[i]) > 0.35)
        return {ok: false, reason: `Bar sizes don't match the problem. Adjust proportions.`};
    if (Math.abs(pw.reduce((a, b) => a + b, 0) - 1.0) > 0.30)
      return {ok: false, reason: 'Parts should together match the whole bar width.'};
  }
  if (problem.type === 'frac') {
    const s = [...nf].sort((a, b) => b.w - a.w);
    if (s.length >= 2) {
      const ratio = s[1].w / s[0].w, exp = problem.proportions[0];
      if (Math.abs(ratio - exp) > exp * 0.35)
        return {ok: false, reason: `The unknown part should be about 1/${problem.denominator} of the whole.`};
    }
  }
  if (problem.type === 'mul') {
    const s = [...nf].sort((a, b) => b.w - a.w);
    if (s.length >= 2) {
      const ratio = s[0].w / s[1].w, exp = problem.proportions[0];
      const word = exp === 2 ? 'twice' : exp === 3 ? 'three times' : exp === 4 ? 'four times' : `${exp}×`;
      if (Math.abs(ratio - exp) > exp * 0.35)
        return {ok: false, reason: `Adjust bar sizes — one should be about ${word} the length of the other.`};
    }
  }
  return {ok: true, reason: null};
}

function evaluateWordProblem(bars) {
  const p = PRACTICE[S.practiceStep];
  const result = checkModel(bars, p);
  S.responses.push({ok: result.ok});
  const main = document.getElementById('main');
  if (!main) return;
  if (result.ok) {
    main.innerHTML += `<div class="feedback-card ok" style="margin-top:10px">Bar model correct!</div>
      <button class="btn-continue" style="margin-top:10px" onclick="nextPracticeStep()">${S.practiceStep < S.totalPractice - 1 ? 'Next problem →' : 'Finish →'}</button>`;
  } else {
    main.innerHTML += `<div class="feedback-card err" style="margin-top:10px">${result.reason}</div>
      <button class="btn-continue" style="margin-top:10px" onclick="retryDraw()">Try again</button>`;
  }
}

function retryDraw() {
  const iframe = document.getElementById('draw-iframe');
  if (iframe) iframe.contentWindow.postMessage({type: 'wp:reset'}, '*');
  renderPracticeItem();
}

function nextPracticeStep() {
  drawerOpen = false;
  const drawer = document.getElementById('draw-drawer');
  drawer.classList.remove('open', 'wp-mode');
  document.querySelector('.app').classList.remove('wp-panel-open');
  S.practiceStep++;
  if (S.practiceStep >= S.totalPractice) {
    showComplete();
  } else {
    renderPracticeItem();
  }
}

function showComplete() {
  S.phase = 'complete';
  setPhase('Complete');
  updateProgress();
  const correct = S.responses.filter(r => r.ok).length;
  const total = S.responses.length;
  render(`<div class="completion">
    <div style="font-size:44px">✓</div>
    <h2>Unknowns Complete</h2>
    <p>You drew bar models for word problems across all five relation types, marking the unknown with <span class="unk-badge">?</span>.</p>
    <p style="color:var(--accent);font-weight:600">${correct} of ${total} correct</p>
    <div class="nav-links">
      <a class="nav-link" href="${CFG.fluencyHref}">Fluency Practice</a>
      <a class="nav-link primary" href="${CFG.nextHref}">${CFG.nextLabel}</a>
    </div>
  </div>`);
}

// ── Drawing tool integration ──────────────────────────────────────────────────
let drawerOpen = false;
let iframeLoaded = false;

function toggleDrawer() {
  drawerOpen = !drawerOpen;
  const drawer = document.getElementById('draw-drawer');
  drawer.classList.toggle('open', drawerOpen);
  if (drawerOpen && !iframeLoaded) {
    document.getElementById('draw-iframe').src = 'bar_model_draw.html';
    iframeLoaded = true;
  }
}

function openDrawerForProblem(problem) {
  const drawer = document.getElementById('draw-drawer');
  drawer.classList.add('wp-mode');
  document.querySelector('.app').classList.add('wp-panel-open');
  drawerOpen = false;
  toggleDrawer();
  const ctx = {type: 'wp:load', problem};
  if (S.wpIframeReady) {
    document.getElementById('draw-iframe').contentWindow.postMessage(ctx, '*');
  } else {
    S.wpPendingLoad = ctx;
  }
}

window.addEventListener('message', e => {
  const iframe = document.getElementById('draw-iframe');
  if (!iframe || e.source !== iframe.contentWindow) return;
  if (e.data.type === 'wp:ready') {
    S.wpIframeReady = true;
    if (S.wpPendingLoad) {
      iframe.contentWindow.postMessage(S.wpPendingLoad, '*');
      S.wpPendingLoad = null;
    }
  } else if (e.data.type === 'wp:submit') {
    if (S.phase === 'practice') evaluateWordProblem(e.data.bars || []);
  }
});

window.speechSynthesis.onvoiceschanged = () => {};
showIntro();
</script>
</body>
</html>
